[project]
name = "studyforge"
version = "1.0.0"
description = "Agentic web app that turns chapter PDFs into topper-grade notes and a verified question bank."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/File/Form) in defaults

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose, not code — don't enforce line length on it.
"app/agents/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
