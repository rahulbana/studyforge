# Builds the frontend image using Dockerfile.cloudrun (gcloud builds submit
# only uses ./Dockerfile by default, so we need an explicit config).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.cloudrun", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
