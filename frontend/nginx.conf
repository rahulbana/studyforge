server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow PDF uploads up to the backend's limit (MAX_UPLOAD_MB=25) plus a
    # little headroom; nginx's 1m default otherwise rejects them with 413 before
    # they reach the backend.
    client_max_body_size 30m;

    # Proxy API calls to the backend service (same-origin, so no CORS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events (live notes streaming): no buffering, long timeout.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
